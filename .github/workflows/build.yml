name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: What the window needs to be built on Linux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The window, opened for real on a made-up recording, and a picture of it kept.
      - name: Open the window
        env:
          CBASS_LIBRARY: ${{ runner.temp }}/library
          CBASS_NO_AUDIO: '1'
        run: |
          go run ./tools/demosong
          go build -o cbass-app ./cmd/cbass-app
          CBASS_OPEN=demo CBASS_SHOT_AT=9.3 CBASS_SHOT=window-linux.png timeout 120 xvfb-run -a -s "-screen 0 1280x860x24" ./cbass-app
          test -s window-linux.png
      - uses: actions/upload-artifact@v6
        with:
          name: window-linux
          path: window-linux.png

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: cbass-macos-arm64
            binary: cbass
            app: C_bass-macos-arm64
          - os: windows-latest
            name: cbass-windows-x64
            binary: cbass.exe
            app: C_bass-windows-x64
          - os: ubuntu-latest
            name: cbass-linux-x64
            binary: cbass
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=$(git rev-parse --short HEAD)" -o "${{ matrix.binary }}" ./cmd/cbass
      - name: Keep the model between runs
        uses: actions/cache@v5
        with:
          path: model
          key: htdemucs-da9e5101
      # The real thing, on the real machine: separate a short recording made on the spot,
      # read its notes, and say how long it took.
      - name: Try it end to end
        shell: bash
        run: |
          mkdir -p model
          if [ ! -f model/htdemucs.onnx ]; then
            curl -sSfL -o model/htdemucs.onnx https://basso.massimodanieli.com/assets/separator/htdemucs.onnx
          fi
          export CBASS_MODEL="$PWD/model/htdemucs.onnx"
          go run ./tools/testtone trial.wav
          start=$(date +%s)
          "./${{ matrix.binary }}" analyse -stems -o out trial.wav | tee run.log
          took=$(( $(date +%s) - start ))
          cat out/trial.tab.txt | head -12
          test -s out/trial.bass.wav && test -s out/trial.no-bass.wav && test -s out/trial.cbass.json
          go run ./tools/testtone -check out/trial.cbass.json
          echo "::notice title=${{ matrix.name }}::26 seconds of audio analysed in ${took}s ($(grep -c . run.log) steps): $(grep 'read .* notes' run.log | sed 's/^ *//')"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}

      # The application with its window.
      - name: Build the application (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(git rev-parse --short HEAD)
          app=C_bass.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$app/MacOS/C_bass" ./cmd/cbass-app
          sed "s/VERSION/$version/" packaging/Info.plist > "$app/Info.plist"
          go run ./tools/icon C_bass.iconset
          iconutil -c icns -o "$app/Resources/C_bass.icns" C_bass.iconset
          codesign --force --deep --sign - C_bass.app
          codesign --verify --deep --strict C_bass.app
      - name: Build the application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$(git rev-parse --short HEAD)" -o C_bass.exe ./cmd/cbass-app
      # Opened for real on this machine, on a made-up recording, and a picture of it kept.
      - name: Open the window
        if: matrix.app
        shell: bash
        env:
          CBASS_LIBRARY: ${{ runner.temp }}/library
          CBASS_NO_AUDIO: '1'
          CBASS_OPEN: demo
          CBASS_SHOT_AT: '9.3'
          CBASS_SHOT: window.png
        run: |
          go run ./tools/demosong
          program=./C_bass.exe
          if [ "$RUNNER_OS" = macOS ]; then
            program=C_bass.app/Contents/MacOS/C_bass
            # The build machine is a virtual Mac that hands Metal no surface to draw on, so here
            # the window is drawn with OpenGL. On a real Mac it uses Metal.
            export EBITENGINE_GRAPHICS_LIBRARY=opengl
          fi
          "$program" > window.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 1
          done
          said() { echo "$(grep -c nextDrawable window.log || true) frames without a drawable; $(grep -v nextDrawable window.log | tail -8 | tr '\n' ' ' | cut -c 1-800)"; }
          if kill -0 $pid 2>/dev/null; then
            kill $pid
            echo "::error title=${{ matrix.app }}::the window never drew: $(said)"
            exit 1
          fi
          if ! wait $pid || ! test -s window.png; then
            echo "::error title=${{ matrix.app }}::the window did not open: $(said)"
            exit 1
          fi
      - name: Pack the application (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent C_bass.app C_bass-macos-arm64.zip
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.app }}
          path: C_bass-macos-arm64.zip
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.app }}
          path: C_bass.exe
      - uses: actions/upload-artifact@v6
        if: matrix.app
        with:
          name: window-${{ matrix.name }}
          path: window.png
