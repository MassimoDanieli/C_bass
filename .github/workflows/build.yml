name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: Gather the applications in a draft release with this name, such as v0.2.0-beta.1
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: What the window needs to be built on Linux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The window, opened for real on a made-up recording, and a picture of it kept.
      - name: Open the window
        env:
          CBASS_LIBRARY: ${{ runner.temp }}/library
          CBASS_NO_AUDIO: '1'
        run: |
          go run ./tools/demosong
          go build -o cbass-app ./cmd/cbass-app
          CBASS_OPEN=demo-blues CBASS_SHOT_AT=9.3 CBASS_SHOT=window-linux.png timeout 120 xvfb-run -a -s "-screen 0 1280x860x24" ./cbass-app
          test -s window-linux.png
      - uses: actions/upload-artifact@v6
        with:
          name: window-linux
          path: window-linux.png

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: cbass-macos-arm64
            binary: cbass
            app: C_bass-macos-arm64
          - os: windows-latest
            name: cbass-windows-x64
            binary: cbass.exe
            app: C_bass-windows-x64
          # an older Ubuntu on purpose: what is built there runs on newer systems, not the other way round
          - os: ubuntu-22.04
            name: cbass-linux-x64
            binary: cbass
            app: C_bass-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The version is the name given to a draft release, or else the commit.
      - name: Version
        id: version
        shell: bash
        run: |
          version="${{ inputs.draft }}"
          version="${version#v}"
          if [ -z "$version" ]; then version="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o "${{ matrix.binary }}" ./cmd/cbass
      - name: Keep the model between runs
        uses: actions/cache@v5
        with:
          path: model
          key: htdemucs-da9e5101
      # The real thing, on the real machine: separate a short recording made on the spot,
      # read its notes, and say how long it took.
      - name: Try it end to end
        shell: bash
        run: |
          mkdir -p model
          if [ ! -f model/htdemucs.onnx ]; then
            curl -sSfL -o model/htdemucs.onnx https://basso.massimodanieli.com/assets/separator/htdemucs.onnx
          fi
          export CBASS_MODEL="$PWD/model/htdemucs.onnx"
          go run ./tools/testtone trial.wav
          start=$(date +%s)
          "./${{ matrix.binary }}" analyse -stems -o out trial.wav | tee run.log
          took=$(( $(date +%s) - start ))
          cat out/trial.tab.txt | head -12
          test -s out/trial.bass.wav && test -s out/trial.no-bass.wav && test -s out/trial.cbass.json
          go run ./tools/testtone -check out/trial.cbass.json
          echo "::notice title=${{ matrix.name }}::26 seconds of audio analysed in ${took}s ($(grep -c . run.log) steps): $(grep 'read .* notes' run.log | sed 's/^ *//')"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}

      # The application with its window.
      - name: Build the application (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${{ steps.version.outputs.version }}"
          app=C_bass.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$app/MacOS/C_bass" ./cmd/cbass-app
          sed "s/VERSION/$version/" packaging/Info.plist > "$app/Info.plist"
          go run ./tools/icon C_bass.iconset
          iconutil -c icns -o "$app/Resources/C_bass.icns" C_bass.iconset
          codesign --force --deep --sign - C_bass.app
          codesign --verify --deep --strict C_bass.app
      - name: Build the application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the icon goes into the program itself, as a resource the linker picks up
          go run ./tools/icon C_bass.ico
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico C_bass.ico -o cmd/cbass-app/rsrc_windows_amd64.syso
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.version.outputs.version }}" -o C_bass.exe ./cmd/cbass-app
      - name: Build the application (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o c-bass ./cmd/cbass-app
      # Opened for real on this machine, on one of the pieces that come with it, and a picture kept.
      - name: Open the window
        if: matrix.app
        shell: bash
        env:
          CBASS_LIBRARY: ${{ runner.temp }}/library
          CBASS_NO_AUDIO: '1'
          CBASS_OPEN: demo-blues
          CBASS_SHOT_AT: '9.3'
        run: |
          go run ./tools/demosong
          # by its full path: inside an application bundle macOS starts the program in another folder
          export CBASS_SHOT="$PWD/window.png"
          case "$RUNNER_OS" in
            macOS) C_bass.app/Contents/MacOS/C_bass > window.log 2>&1 & ;;
            Windows) ./C_bass.exe > window.log 2>&1 & ;;
            Linux) xvfb-run -a -s "-screen 0 1280x860x24" ./c-bass > window.log 2>&1 & ;;
          esac
          pid=$!
          for i in $(seq 1 90); do
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 1
          done
          said() { echo "$(grep -c nextDrawable window.log || true) frames without a drawable; $(grep -v -e nextDrawable -e ALSA window.log | tail -8 | tr '\n' ' ' | cut -c 1-800)"; }
          if kill -0 $pid 2>/dev/null; then
            kill $pid
            echo "::error title=${{ matrix.app }}::the window never drew: $(said)"
            exit 1
          fi
          status=0
          wait $pid || status=$?
          if [ $status -ne 0 ] || ! test -s window.png; then
            echo "::error title=${{ matrix.app }}::the window did not open (left with $status, picture: $(ls -l window.png 2>&1 | cut -c 1-80)): $(said)"
            exit 1
          fi

      # What people download: a disk image for macOS, an installer for Windows, a package and an
      # archive for Linux. Each is tried here: installed, started, and taken away again.
      - name: Pack the application (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent C_bass.app C_bass-macos-arm64.zip
          mkdir dmg
          cp -R C_bass.app dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do # the build machines sometimes hold the folder busy for a moment
            if hdiutil create -volname C_bass -srcfolder dmg -ov -format UDZO C_bass-macos-arm64.dmg; then break; fi
            sleep 5
          done
          hdiutil verify C_bass-macos-arm64.dmg
          hdiutil attach -nobrowse -readonly -mountpoint mounted C_bass-macos-arm64.dmg
          test -x mounted/C_bass.app/Contents/MacOS/C_bass
          test -L mounted/Applications
          codesign --verify --deep --strict mounted/C_bass.app
          hdiutil detach mounted
      - name: Pack the application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CBASS_LIBRARY: ${{ runner.temp }}\library
          CBASS_NO_AUDIO: '1'
          CBASS_OPEN: demo-blues
          CBASS_SHOT: ${{ runner.temp }}\installed.png
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSource=$PWD\C_bass.exe" "/DIcon=$PWD\C_bass.ico" packaging\C_bass.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # install it as a person would, without the questions
          Start-Process -Wait .\C_bass-windows-x64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $installed = "$env:LOCALAPPDATA\Programs\C_bass\C_bass.exe"
          if (-not (Test-Path $installed)) { Write-Host "::error::the installer did not put the program in $installed"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\C_bass.lnk")) { Write-Host "::error::no entry in the Start menu"; exit 1 }
          $running = Start-Process $installed -PassThru
          if (-not $running.WaitForExit(90000)) { $running.Kill(); Write-Host "::error::the installed program never drew its window"; exit 1 }
          if (-not (Test-Path $env:CBASS_SHOT)) { Write-Host "::error::the installed program left no picture"; exit 1 }
          # and take it away again
          Start-Process -Wait "$env:LOCALAPPDATA\Programs\C_bass\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if (Test-Path $installed) { Write-Host "::error::the program is still there after uninstalling"; exit 1 }
      - name: Pack the application (Linux)
        if: runner.os == 'Linux'
        env:
          CBASS_LIBRARY: ${{ runner.temp }}/library
          CBASS_NO_AUDIO: '1'
          CBASS_OPEN: demo-blues
        run: |
          sh packaging/linux.sh ./c-bass "${{ steps.version.outputs.version }}" dist
          # the package: installed with what it says it needs, started, removed
          sudo apt-get install -y ./dist/C_bass-linux-x64.deb
          test "$(command -v c-bass)" = /usr/bin/c-bass
          CBASS_SHOT="$PWD/installed.png" timeout 120 xvfb-run -a -s "-screen 0 1280x860x24" c-bass
          test -s installed.png
          sudo apt-get remove -y c-bass
          ! command -v c-bass
          # the archive: installed in a home of its own, started, removed
          mkdir home && tar -xzf dist/C_bass-linux-x64.tar.gz -C home
          HOME="$PWD/home" sh home/C_bass-linux-x64/install.sh
          CBASS_SHOT="$PWD/installed-archive.png" timeout 120 xvfb-run -a -s "-screen 0 1280x860x24" home/.local/bin/c-bass
          test -s installed-archive.png
          HOME="$PWD/home" sh home/C_bass-linux-x64/install.sh --remove
          test ! -e home/.local/bin/c-bass
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.app }}
          path: |
            C_bass-macos-arm64.dmg
            C_bass-macos-arm64.zip
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.app }}
          path: |
            C_bass-windows-x64-setup.exe
            C_bass.exe
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.app }}
          path: |
            dist/C_bass-linux-x64.deb
            dist/C_bass-linux-x64.tar.gz
      - uses: actions/upload-artifact@v6
        if: matrix.app
        with:
          name: window-${{ matrix.name }}
          path: window.png

  # Run by hand with a name, the build gathers the applications in a draft release: nothing is
  # public, and no tag is made, until the draft is published by hand.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: built
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.draft }}
        run: |
          mkdir out
          cp built/C_bass-macos-arm64/C_bass-macos-arm64.dmg out/
          cp built/C_bass-macos-arm64/C_bass-macos-arm64.zip out/
          cp built/C_bass-windows-x64/C_bass-windows-x64-setup.exe out/
          cp built/C_bass-windows-x64/C_bass.exe out/C_bass-windows-x64-portable.exe
          cp built/C_bass-linux-x64/C_bass-linux-x64.deb out/
          cp built/C_bass-linux-x64/C_bass-linux-x64.tar.gz out/
          cat > notes.md <<'END'
          | | |
          |---|---|
          | **macOS** (Apple Silicon) | `C_bass-macos-arm64.dmg`: open it and drag C_bass to Applications |
          | **Windows** (64-bit) | `C_bass-windows-x64-setup.exe`: the installer, for your user only, no administrator needed. `C_bass-windows-x64-portable.exe` runs without installing |
          | **Linux** (64-bit) | `C_bass-linux-x64.deb` for Debian, Ubuntu, Mint: `sudo apt install ./C_bass-linux-x64.deb`. `C_bass-linux-x64.tar.gz` for the others: unpack and run `./install.sh` |

          None of these is signed with a paid certificate, so the system asks before the first start. macOS: System Settings → Privacy & Security → Open Anyway. Windows: More info → Run anyway.

          *Nessuno di questi è firmato con un certificato a pagamento, quindi al primo avvio il sistema chiede conferma. macOS: Impostazioni di Sistema → Privacy e sicurezza → Apri comunque. Windows: Ulteriori informazioni → Esegui comunque.*
          END
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" --title "C_bass $TAG" --notes-file notes.md out/*
